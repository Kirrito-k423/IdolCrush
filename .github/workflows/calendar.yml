name: Refresh public calendar

on:
  workflow_dispatch:
  schedule:
    # 06:22 in Beijing.
    - cron: '22 22 * * *'

permissions:
  contents: write

concurrency:
  group: public-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh official listings
        run: python3 scripts/update_calendar.py
      - name: Save the calendar
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- docs/data/calendar.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/calendar.js
          git commit -m "Refresh public calendar"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:refs/heads/$BRANCH"
