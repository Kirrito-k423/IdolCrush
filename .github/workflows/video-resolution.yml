name: Refresh Bilibili video resolution

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh Bilibili videos']
    branches: [main]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: bilibili-video-resolution
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check public video dimensions
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
        run: python3 scripts/refresh_video_resolution.py
      - name: Check curated YouTube formats
        run: python3 scripts/refresh_youtube_resolution.py
      - name: Save verified metadata
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- docs/data/video-resolution.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/video-resolution.js
          git commit -m 'Refresh Bilibili video resolution'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Report metadata source availability
        run: python3 scripts/refresh_video_resolution.py --check-status
