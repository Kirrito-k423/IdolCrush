name: Refresh Bilibili videos

on:
  workflow_dispatch:
  schedule:
    # 12:15 and 22:00 in Beijing (GitHub Actions uses UTC).
    - cron: '15 4 * * *'
    - cron: '0 14 * * *'

permissions:
  contents: write

concurrency:
  group: bilibili-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh public video sources
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
        run: python3 scripts/update_bilibili.py --pages 4 --dynamic-pages 2 --pause 0.8
      - name: Save the video archive
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- docs/data/bilibili.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/bilibili.js
          git commit -m 'Refresh Bilibili videos'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Report source availability
        run: python3 scripts/update_bilibili.py --check-status
  youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Refresh YouTube channel feeds
        run: python3 scripts/update_youtube.py
      - name: Save the video archive
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- docs/data/youtube.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/youtube.js
          git commit -m 'Refresh YouTube videos'
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin "HEAD:refs/heads/$BRANCH"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Report source availability
        run: python3 scripts/update_youtube.py --check-status
